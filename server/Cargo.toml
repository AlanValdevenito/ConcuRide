[package]
name = "server"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
colored = "2.0"
actix = "0.13.5"
actix-rt = "2.10.0"
actix_async_handler = "0.1.0"
tokio = "1.41.0"
tokio-stream = { version = "^0.1.14", features = ["io-util"] }
serde = {version = "1.0.214", features = ["derive"]}
serde_json = "1.0.132"
common = {path = "../common"}
rand = "0.8.5"
colog = "1.3.0"
log = "0.4.22"
udp-stream = "0.0.12"
